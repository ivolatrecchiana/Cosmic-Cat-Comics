<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>COSMIC 🐱 - Register</title>
        <link rel="stylesheet" href="CSS-All.css">
        <link rel="stylesheet" href="CSS-Register.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body> 
        <div class="contenedor-registro">
            <div class="logo-comic">
                <h1>COSMIC</h1>
                <div class="tarjeta-comic">
                    <h1>¡Registrate YA!</h1>
                    <br>
                    <h3>Ingrese sus datos por favor</h3>
                    <form action="Homepage.html" method="get">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                        <br>
                        <br>            
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                        <br>
                        <br>            
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                        <br>
                        <br>            
                        <button class="boton-registro" type="submit">Registrarse</button>
                        <button class="boton-iniciar" type="button" onclick="window.location.href='Login.html'">Iniciar sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
